        locationType:
          $ref: '#/components/schemas/JobLocationType'
        type:
          $ref: '#/components/schemas/JobType'
        experienceLevel:
          type: string
          enum: [ENTRY, MID, SENIOR, LEAD, EXECUTIVE]
        salaryMin:
          type: integer
        salaryMax:
          type: integer
        description:
          type: string
        requirements:
          type: string
        status:
          type: string
          enum: [DRAFT, OPEN, PAUSED, CLOSED]
        isPinned:
          type: boolean

