components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256 JWT access token (15min expiry)
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for programmatic access

  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
    LabelId:
      name: id
      in: path
      required: true
      schema:
        type: string
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    AdminPage:
      name: page
      in: query
      schema:
        type: integer
        default: 1
    AdminPageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Rate limited
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
        X-RateLimit-Remaining:
          schema:
            type: integer
        X-RateLimit-Reset:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        code:
          type: string

    # ─── ENUMS ───
    TaskStatus:
      type: string
      enum: [TODO, IN_PROGRESS, IN_REVIEW, BLOCKED, COMPLETED, CANCELLED]
    Priority:
      type: string
      enum: [URGENT, HIGH, MEDIUM, LOW]
    TaskEnergy:
      type: string
      enum: [LOW, MEDIUM, HIGH]
    TaskIntent:
      type: string
      enum: [EXECUTION, PLANNING, REVIEW, LEARNING, COMMUNICATION]
    WorkspaceRole:
      type: string
      enum: [OWNER, ADMIN, MEMBER, GUEST]
    ProjectRole:
      type: string
      enum: [MANAGER, COLLABORATOR, VIEWER]
    ProjectStatus:
      type: string
      enum: [PLANNING, ACTIVE, ON_HOLD, COMPLETED, ARCHIVED]
    FocusType:
      type: string
      enum: [POMODORO, SHORT_BREAK, LONG_BREAK, DEEP_WORK, CUSTOM]
    TimeEntryCategory:
      type: string
      enum: [DEEP_WORK, MEETINGS, ADMIN, LEARNING, BREAK, OTHER]
    MeetingStatus:
      type: string
      enum: [SCHEDULED, ONGOING, COMPLETED, CANCELLED]
    AnnouncementVisibility:
      type: string
      enum: [PUBLIC, PRIVATE]
    FeatureStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, PLANNED, COMPLETED]
    JobDepartment:
      type: string
      enum: [ENGINEERING, DESIGN, PRODUCT, MARKETING, SALES, CUSTOMER_SUCCESS, OPERATIONS, FINANCE, HR, OTHER]
    JobLocationType:
      type: string
      enum: [REMOTE, ONSITE, HYBRID]
    JobType:
      type: string
      enum: [FULL_TIME, PART_TIME, CONTRACT, INTERNSHIP, FREELANCE]

    # ─── AUTH ───
    ExchangeRequest:
      type: object
      required: [userId, email, role, sessionId, timestamp, signature]
      properties:
        userId:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [USER, ADMIN, SUPER_ADMIN]
        sessionId:
          type: string
          format: uuid
        timestamp:
          type: integer
        signature:
          type: string
          pattern: '^[a-f0-9]{64}$'
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    TokenResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            accessToken:
              type: string
            refreshToken:
              type: string
            expiresIn:
              type: integer
            user:
              $ref: '#/components/schemas/User'

    # ─── USER ───
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        image:
          type: string
          nullable: true
        role:
          type: string
          enum: [USER, ADMIN, SUPER_ADMIN]
        bio:
          type: string
          nullable: true
        timezone:
          type: string
        theme:
          type: string
        twoFactorEnabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        bio:
          type: string
          maxLength: 500
          nullable: true
        timezone:
          type: string
        image:
          type: string
