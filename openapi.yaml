      tags: [Workspace]
      summary: Update member role
      operationId: updateMemberRole
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: memberId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: '#/components/schemas/WorkspaceRole'
      responses:
