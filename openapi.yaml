      tags: [Workspace]
      summary: Workspace statistics
      operationId: getWorkspaceStats
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
