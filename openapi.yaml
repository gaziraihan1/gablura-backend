    get:
      tags: [Workspace]
      summary: Storage usage
      operationId: getWorkspaceStorage
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
