openapi: 3.0.3
info:
  title: Gablura API
  description: |
    # Gablura — Team Productivity & Focus SaaS Platform

    A production-grade REST API powering Gablura, a comprehensive team productivity platform with task management, focus sessions, AI-powered insights, calendar optimization, burnout prevention, and multi-provider billing.

    ## Architecture
    - **Runtime:** Node.js 22.x (ESM)
    - **Framework:** Express 5.1 with TypeScript 5.9 (strict)
    - **Database:** PostgreSQL 16 via Prisma 5.22 ORM
    - **Cache/Queue:** Redis 7 + BullMQ 5.80 (8 background workers)
    - **Auth:** RS256 JWT with session binding, device fingerprinting, and hijack detection
    - **AI:** Google Gemini integration for task autocomplete, goal breakdown, daily planning, meeting summaries, and weekly insights
    - **Payments:** Stripe, Paddle, and LemonSqueezy (multi-provider)
    - **Integrations:** GitHub, Slack, Google Calendar, Trello

    ## Features
    - **Task Management:** CRUD, subtasks, comments, attachments, labels, dependencies, recurring tasks, time tracking
    - **Kanban Board:** Drag-and-drop, WIP limits, focus mode
    - **Calendar & Wellness:** Daily aggregates, energy logging, burnout detection, capacity planning, wellness recommendations
    - **Focus Sessions:** Pomodoro, Deep Work, Short/Long Break, Custom timers
    - **AI Features:** Task autocomplete, goal breakdown, comment assist, daily plan, meeting summaries, weekly insights
    - **Project Management:** Sections, sprints, milestones, views (Kanban/List/Calendar/Timeline), favorites
    - **Workspace Management:** Multi-workspace, roles (Owner/Admin/Member/Guest), invitations, usage tracking
    - **Billing:** 3 payment providers, subscription management, invoicing, usage-based limits
    - **Integrations:** GitHub (PR/issue/branch/commit linking), Slack, Google Calendar, Trello
    - **Notifications:** Server-Sent Events (SSE) streaming, 21 notification types
    - **Admin Panel:** User management, workspace oversight, billing, activity logs, resource management
    - **Automation Rules:** Trigger-based workflows (status change, task creation, due date, assignee, label, mention)
    - **File Management:** Cloudinary integration, bulk operations, storage analytics
    - **API Keys:** Programmatic access with granular permissions

    ## Rate Limiting
    All authenticated endpoints are rate-limited per-user with tier-based limits:
    | Tier | Window | Limit |
    |------|--------|-------|
    | Free | 60s | 60 requests |
    | Pro | 60s | 120 requests |
    | Business | 60s | 300 requests |

    Rate limit headers: `X-RateLimit-Limit`, `X-RateLimit-Remaining`, `X-RateLimit-Reset`

    ## Error Handling
    All errors follow: `{"success": false, "message": "...", "code": "ERROR_CODE"}`
    Common codes: `TOKEN_EXPIRED`, `TOKEN_INVALID`, `CSRF_VALIDATION_FAILED`, `RATE_LIMIT_EXCEEDED`, `AI_MONTHLY_QUOTA_EXCEEDED`, `INSUFFICIENT_STORAGE`

    ## Pagination
    List endpoints support: `?page=1&pageSize=20&sortBy=createdAt&sortOrder=desc`
    Response envelope: `{"success": true, "data": [...], "pagination": {"page": 1, "pageSize": 20, "total": 150, "totalPages": 8}}`
  version: 1.0.0
  contact:
    name: Gablura Support
    email: support@gablura.io
    url: https://gablura.io
  license:
    name: Proprietary
    url: https://gablura.io/license

servers:
  - url: https://api.gablura.io
    description: Production
  - url: http://localhost:3001
    description: Local development

security:
  - BearerAuth: []

