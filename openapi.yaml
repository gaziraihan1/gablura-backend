    description: Health checks and debugging
  - name: Auth
    description: Token exchange, refresh, and logout
  - name: User
    description: Profile, password, 2FA, sessions
  - name: Workspace
    description: Multi-workspace management, members, invitations
  - name: Project
    description: Project CRUD, sections, sprints, milestones, views, favorites
  - name: Task
    description: Task CRUD, status, recurrence, GitHub/Slack linking
  - name: Subtask
    description: Subtask management under tasks
  - name: Comment
    description: Task comments with @mentions
  - name: Label
    description: Task labeling and categorization
  - name: DailyTask
    description: Daily task planning and tracking
  - name: FocusSession
    description: Pomodoro, deep work, and break timers
  - name: TimeEntry
    description: Time tracking with categories
  - name: Calendar
    description: Calendar aggregates, energy, burnout, goals, capacity
  - name: Analytics
    description: Workspace and project analytics
  - name: AI
    description: AI-powered features (Google Gemini)
  - name: Automation
    description: Trigger-based automation rules
  - name: Notification
    description: SSE streaming and notification management
  - name: Storage
    description: File storage management and quotas
  - name: Upload
    description: File upload to Cloudinary
  - name: Billing
    description: Subscription, checkout, invoices
  - name: Integration
    description: GitHub, Slack, Google Calendar, Trello
  - name: Meeting
    description: Meeting scheduling and management
  - name: Announcement
    description: Workspace and project announcements
  - name: Feature
    description: Feature requests and voting
  - name: Template
    description: Project templates
  - name: Rating
    description: App ratings
  - name: Contact
    description: Contact form submissions
  - name: Job
    description: Job postings
  - name: Resource
    description: Popular resources and product updates
  - name: Admin
    description: Admin panel operations
  - name: APIKey
    description: API key management
  - name: Webhook
    description: Payment and integration webhooks

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      operationId: healthCheck
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  uptime:
                    type: number
                  timestamp:
                    type: string
                    format: date-time

  /health/db-pool:
    get:
      tags: [Health]
      summary: Database pool health
      security: []
      operationId: dbPoolHealth
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Pool stats

  /api/v1/auth/exchange:
    post:
      tags: [Auth]
      summary: Exchange NextAuth session for JWT
      security: []
      operationId: exchangeToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeRequest'
      responses:
        '200':
          description: Tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      security: []
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      operationId: logout
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                logoutAll:
                  type: boolean
                  default: false
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Logged out

  /api/v1/csrf-token:
    get:
      tags: [Auth]
      summary: Get CSRF token
      operationId: getCsrfToken
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: CSRF token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string

  /api/v1/user/profile:
    get:
      tags: [User]
      summary: Get current user profile
      operationId: getUserProfile
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    put:
      tags: [User]
      summary: Update profile
      operationId: updateUserProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Updated profile

  /api/v1/user/password:
    put:
      tags: [User]
      summary: Change password
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Password changed

  /api/v1/user/export-data:
    post:
      tags: [User]
      summary: Export user data (GDPR)
      operationId: exportUserData
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Export initiated

  /api/v1/user/account:
    delete:
      tags: [User]
      summary: Delete account
      operationId: deleteUserAccount
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Account deleted

  /api/v1/user/security:
    get:
      tags: [User]
      summary: Get security info
      operationId: getUserSecurity
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Security info

  /api/v1/user/2fa/setup:
    post:
      tags: [User]
      summary: Setup 2FA
      operationId: setup2FA
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 2FA setup data
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
                  qrCode:
                    type: string
                  backupCodes:
                    type: array
                    items:
                      type: string

  /api/v1/user/2fa/verify:
    post:
      tags: [User]
      summary: Verify 2FA code
      operationId: verify2FA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  pattern: '^\d{6}$'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 2FA enabled

  /api/v1/user/2fa/disable:
    post:
      tags: [User]
      summary: Disable 2FA
      operationId: disable2FA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 2FA disabled

  /api/v1/user/sessions:
    get:
      tags: [User]
      summary: List active sessions
      operationId: getUserSessions
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Active sessions
    delete:
      tags: [User]
      summary: Revoke all sessions
      operationId: revokeAllSessions
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: All sessions revoked

  /api/v1/user/sessions/{sessionId}:
    delete:
      tags: [User]
      summary: Revoke specific session
      operationId: revokeSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Session revoked

  /api/v1/user/workspace-members:
    get:
      tags: [User]
      summary: Get workspace members
      operationId: getWorkspaceMembers
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Members list

  /api/v1/workspaces:
    get:
      tags: [Workspace]
      summary: List user's workspaces
      operationId: listWorkspaces
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Workspaces
    post:
      tags: [Workspace]
      summary: Create workspace
      operationId: createWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '201':
          description: Created

  /api/v1/workspaces/public:
    get:
      tags: [Workspace]
      summary: Browse public workspaces
      operationId: listPublicWorkspaces
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Public workspaces

  /api/v1/workspaces/invitations/{token}:
    get:
      tags: [Workspace]
      summary: Get invitation details
      security: []
      operationId: getInvitation
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Invitation details

  /api/v1/workspaces/invitations/{token}/accept:
    post:
      tags: [Workspace]
      summary: Accept invitation
      operationId: acceptInvitation
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Accepted

  /api/v1/workspaces/{workspaceId}:
    get:
      tags: [Workspace]
      summary: Get workspace
      operationId: getWorkspace
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'

    put:
      tags: [Workspace]
      summary: Update workspace
      operationId: updateWorkspace
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkspaceRequest'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Updated
    delete:
      tags: [Workspace]
      summary: Delete workspace
      operationId: deleteWorkspace
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Deleted

  /api/v1/workspaces/{slug}/overview:
    get:
      tags: [Workspace]
      summary: Workspace overview
      operationId: getWorkspaceOverview
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Overview

  /api/v1/workspaces/{workspaceSlug}/tasks:
    get:
      tags: [Workspace]
      summary: List workspace tasks
      operationId: listWorkspaceTasks
      parameters:
        - name: workspaceSlug
          in: path
          required: true
          schema:
            type: string
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Tasks

  /api/v1/workspaces/{workspaceId}/members:
    get:
      tags: [Workspace]
      summary: List workspace members
      operationId: listWorkspaceMembers
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
