          type: string
        status:
          type: string
          enum: [DRAFT, OPEN, PAUSED, CLOSED]
          default: DRAFT
        closingDate:
          type: string
          format: date-time
        applicationUrl:
          type: string
          format: uri
        applicationEmail:
          type: string
          format: email
        isPinned:
