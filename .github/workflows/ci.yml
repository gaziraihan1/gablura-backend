name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: focura_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install system dependencies
        run: |
          sudo apt-get update
      - name: Wait for Redis
        run: |
          for i in {1..20}; do
            nc -z localhost 6379 && echo "Redis ready" && exit 0
            sleep 2
          done
          echo "Redis failed to start" && exit 1

      - name: Generate RSA keys
        run: |
          mkdir -p keys
          openssl genrsa -out keys/private.pem 2048
          openssl rsa -in keys/private.pem -pubout -out keys/public.pem

      - name: Set environment variables & generate RSA keys
        run: |
           echo "NODE_ENV=test" >> $GITHUB_ENV
           echo "PORT=5001" >> $GITHUB_ENV

           echo "DATABASE_URL=postgresql://postgres:test_password@localhost:5432/focura_test" >> $GITHUB_ENV
           echo "DIRECT_URL=postgresql://postgres:test_password@localhost:5432/focura_test" >> $GITHUB_ENV
           echo "TEST_DATABASE_URL=postgresql://postgres:test_password@localhost:5432/focura_test" >> $GITHUB_ENV

           echo "REDIS_URL=redis://127.0.0.1:6379" >> $GITHUB_ENV

           # RSA keys – expose both file paths and base64 strings (keys generated in a prior step)
           echo "JWT_PRIVATE_KEY_PATH=./keys/private.pem" >> $GITHUB_ENV
           echo "JWT_PUBLIC_KEY_PATH=./keys/public.pem" >> $GITHUB_ENV
           echo "JWT_PRIVATE_KEY=$(cat keys/private.pem | base64 -w 0)" >> $GITHUB_ENV
           echo "JWT_PUBLIC_KEY=$(cat keys/public.pem | base64 -w 0)" >> $GITHUB_ENV

           echo "NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}" >> $GITHUB_ENV
           echo "ACCESS_TOKEN_SECRET=${{ secrets.ACCESS_TOKEN_SECRET }}" >> $GITHUB_ENV

           echo "STRIPE_SECRET_KEY=sk_test_fake_for_tests_only" >> $GITHUB_ENV
           echo "STRIPE_WEBHOOK_SECRET=whsec_fake_for_tests_only" >> $GITHUB_ENV
           echo "STRIPE_PRICE_PRO_MONTHLY=price_fake" >> $GITHUB_ENV
           echo "STRIPE_PRICE_PRO_YEARLY=price_fake" >> $GITHUB_ENV
           echo "STRIPE_PRICE_BUSINESS_MONTHLY=price_fake" >> $GITHUB_ENV
           echo "STRIPE_PRICE_BUSINESS_YEARLY=price_fake" >> $GITHUB_ENV

           echo "CLOUDINARY_CLOUD_NAME=test" >> $GITHUB_ENV
           echo "CLOUDINARY_API_KEY=test" >> $GITHUB_ENV
           echo "CLOUDINARY_API_SECRET=test" >> $GITHUB_ENV

           echo "CLIENT_URL=http://localhost:3000" >> $GITHUB_ENV
           echo "FRONTEND_URL=http://localhost:3000" >> $GITHUB_ENV

           echo "PAYMENT_PROVIDER=STRIPE" >> $GITHUB_ENV
           echo "FOCURA_ADMIN_IDS=cmq13or010006crfhieczji8v" >> $GITHUB_ENV

            # Enable CSRF enforcement for integration tests
            echo "ENFORCE_CSRF_IN_TESTS=true" >> $GITHUB_ENV

      # ─────────────────────────────────────────────
      # RSA KEYS
      # ─────────────────────────────────────────────
      - name: Verify keys
        run: |
          test -f keys/private.pem
          test -f keys/public.pem

      - name: Clean Prisma client
        run: rm -rf node_modules/.prisma
      # ─────────────────────────────────────────────
      # PRISMA
      # ─────────────────────────────────────────────
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Sync database schema
        run: npx prisma db push --force-reset

      # ─────────────────────────────────────────────
      # TESTS
      # ─────────────────────────────────────────────
      - name: Lint code
        run: npm run lint

      - name: Run tests with coverage thresholds
        run: npm run test:coverage

      # ─────────────────────────────────────────────
      # PERFORMANCE TESTS
      # ─────────────────────────────────────────────
      - name: Run performance tests
        run: |
          # Generate auth token for authenticated scenarios
          TOKEN=$(npx tsx performance/generate-token.ts)
          export AUTH_TOKEN=$TOKEN
          export TEST_SERVER_URL=http://localhost:5001
          
          # Start server in background using tsx to avoid slow build step
          npx tsx src/index.ts &
          SERVER_PID=$!
          
          # Wait for server to be ready
          echo "Waiting for server to start on http://localhost:5001..."
          for i in {1..20}; do
            if curl -s http://localhost:5001/health > /dev/null; then
              echo "✅ Server is up and healthy"
              break
            fi
            echo "Waiting... ($i/20)"
            sleep 2
          done
          
          if ! curl -s http://localhost:5001/health > /dev/null; then
            echo "❌ Server failed to start in time"
            kill $SERVER_PID
            exit 1
          fi
          
          # Execute performance test suite
          npm run test:performance
          
          # Cleanup
          kill $SERVER_PID

      # ─────────────────────────────────────────────
      # ARTIFACTS
      # ─────────────────────────────────────────────
      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage/
            test-results/

      - name: Debug Prisma
        run: |
          node -e "const { PrismaClient } = require('@prisma/client'); const p = new PrismaClient(); console.log('count:', typeof p.meeting.count)"