name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: gablura_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install system dependencies
        run: |
          sudo apt-get update
      - name: Wait for Redis
        run: |
          for i in {1..20}; do
            nc -z localhost 6379 && echo "Redis ready" && exit 0
            sleep 2
          done
          echo "Redis failed to start" && exit 1

      - name: Generate RSA keys
        run: |
          mkdir -p keys
          openssl genrsa -out keys/private.pem 2048
          openssl rsa -in keys/private.pem -pubout -out keys/public.pem

      - name: Set environment variables & generate RSA keys
        run: |
          echo "NODE_ENV=test" >> $GITHUB_ENV
          echo "PORT=5001" >> $GITHUB_ENV

          echo "DATABASE_URL=postgresql://postgres:test_password@localhost:5432/gablura_test" >> $GITHUB_ENV
          echo "DIRECT_URL=postgresql://postgres:test_password@localhost:5432/gablura_test" >> $GITHUB_ENV
          echo "TEST_DATABASE_URL=postgresql://postgres:test_password@localhost:5432/gablura_test" >> $GITHUB_ENV

          echo "REDIS_URL=redis://127.0.0.1:6379" >> $GITHUB_ENV
          echo "UPSTASH_REDIS_REST_URL=${{ secrets.UPSTASH_REDIS_REST_URL }}" >> $GITHUB_ENV
          echo "UPSTASH_REDIS_REST_TOKEN=${{ secrets.UPSTASH_REDIS_REST_TOKEN }}" >> $GITHUB_ENV

          # RSA keys – expose both file paths and base64 strings (keys generated in a prior step)
          echo "JWT_PRIVATE_KEY_PATH=./keys/private.pem" >> $GITHUB_ENV
          echo "JWT_PUBLIC_KEY_PATH=./keys/public.pem" >> $GITHUB_ENV
          echo "JWT_PRIVATE_KEY=$(cat keys/private.pem | base64 -w 0)" >> $GITHUB_ENV
          echo "JWT_PUBLIC_KEY=$(cat keys/public.pem | base64 -w 0)" >> $GITHUB_ENV

          echo "NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}" >> $GITHUB_ENV
          echo "ACCESS_TOKEN_SECRET=${{ secrets.ACCESS_TOKEN_SECRET }}" >> $GITHUB_ENV


          echo "STRIPE_SECRET_KEY=sk_test_fake_for_tests_only" >> $GITHUB_ENV
          echo "STRIPE_WEBHOOK_SECRET=whsec_fake_for_tests_only" >> $GITHUB_ENV
          echo "STRIPE_PRICE_PRO_MONTHLY=price_fake" >> $GITHUB_ENV
          echo "STRIPE_PRICE_PRO_YEARLY=price_fake" >> $GITHUB_ENV
          echo "STRIPE_PRICE_BUSINESS_MONTHLY=price_fake" >> $GITHUB_ENV
          echo "STRIPE_PRICE_BUSINESS_YEARLY=price_fake" >> $GITHUB_ENV

          echo "CLOUDINARY_CLOUD_NAME=test" >> $GITHUB_ENV
          echo "CLOUDINARY_API_KEY=test" >> $GITHUB_ENV
          echo "CLOUDINARY_API_SECRET=test" >> $GITHUB_ENV

          echo "CLIENT_URL=http://localhost:3000" >> $GITHUB_ENV
          echo "FRONTEND_URL=http://localhost:3000" >> $GITHUB_ENV

          echo "PAYMENT_PROVIDER=STRIPE" >> $GITHUB_ENV
          echo "GABLURA_ADMIN_IDS=cmq13or010006crfhieczji8v" >> $GITHUB_ENV

           # Enable CSRF enforcement for integration tests
           echo "ENFORCE_CSRF_IN_TESTS=true" >> $GITHUB_ENV

      # ─────────────────────────────────────────────
      # RSA KEYS
      # ─────────────────────────────────────────────
      - name: Verify keys
        run: |
          test -f keys/private.pem
          test -f keys/public.pem

      - name: Clean Prisma client
        run: rm -rf node_modules/.prisma
      # ─────────────────────────────────────────────
      # PRISMA
      # ─────────────────────────────────────────────
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Sync database schema
        run: npx prisma db push --force-reset

      # ─────────────────────────────────────────────
      # TESTS
      # ─────────────────────────────────────────────
      - name: Lint code
        run: npm run lint

      - name: Run tests with coverage thresholds
        run: npm run test:coverage

      # ─────────────────────────────────────────────
      # DATA INTEGRITY (compound FK workspaceSlug backfill gate)
      # ─────────────────────────────────────────────
      - name: Check workspace slug integrity
        run: npm run check:integrity

      # ─────────────────────────────────────────────
      # PERFORMANCE TESTS
      # ─────────────────────────────────────────────
      - name: Run performance tests
        run: |
          TOKEN=$(npx tsx performance/generate-token.ts | tail -n 1)
          if [ -z "$TOKEN" ]; then
            echo "❌ AUTH_TOKEN generation failed or returned empty"
            exit 1
          fi
          echo "Token length: ${#TOKEN}"
          export AUTH_TOKEN=$TOKEN
          export TEST_SERVER_URL=http://localhost:5001

          npx tsx src/index.ts &
          SERVER_PID=$!

          echo "Waiting for server..."
          SERVER_UP=false
          for i in {1..20}; do
            if curl -s http://localhost:5001/health > /dev/null; then
              echo "✅ Server is up"
              SERVER_UP=true
              break
            fi
            sleep 2
          done

          if [ "$SERVER_UP" != "true" ]; then
            echo "❌ Server failed to start in time"
            kill $SERVER_PID
            exit 1
          fi

          echo "=== Diagnostic: GET /api/v1/workspaces ==="
          curl -v -m 10 -H "Authorization: Bearer $TOKEN" http://localhost:5001/api/v1/workspaces \
            -w "\n>>> HTTP_STATUS:%{http_code} TIME_TOTAL:%{time_total}s\n"

          echo "=== Diagnostic: GET /api/v1/tasks ==="
          curl -v -m 10 -H "Authorization: Bearer $TOKEN" http://localhost:5001/api/v1/tasks \
            -w "\n>>> HTTP_STATUS:%{http_code} TIME_TOTAL:%{time_total}s\n"

          npm run test:performance
          kill $SERVER_PID

      # ─────────────────────────────────────────────
      # POST-DEPLOY HEALTH CHECK (Render auto-deploys on push to main)
      # ─────────────────────────────────────────────
      - name: Wait for Render deploy
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "⏳ Waiting 90s for Render to pick up the push and deploy..."
          echo "(Render free tier cold starts can take 2-5 minutes)"
          sleep 90

      - name: Health check gate
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          HEALTH_URL="${{ secrets.PRODUCTION_URL }}/health"
          echo "🔍 Checking $HEALTH_URL"
          echo "(Up to 20 attempts, ~10 min window for Render cold start)"
          echo ""

          for i in {1..20}; do
            # 30s timeout per attempt — Render cold starts are slow
            RESPONSE=$(curl -s -w "\n%{http_code}" --connect-timeout 10 -m 30 "$HEALTH_URL" 2>/dev/null)
            CURL_EXIT=$?
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | sed '$d')

            # curl exit 28 = timeout, exit 7 = connection refused — both mean not ready
            if [ $CURL_EXIT -eq 28 ] || [ $CURL_EXIT -eq 7 ] || [ -z "$HTTP_CODE" ]; then
              echo "Attempt $i: Connection timeout/refused (Render cold starting...)"
              sleep 30
              continue
            fi

            echo "Attempt $i: HTTP $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ]; then
              STATUS=$(echo "$BODY" | grep -o '"status":"[^"]*"' | head -1)
              DB_PRIMARY=$(echo "$BODY" | grep -o '"primary":"[^"]*"' | head -1)
              echo "✅ Health check passed: $STATUS, $DB_PRIMARY"
              exit 0
            fi

            echo "⚠️  Got $HTTP_CODE, retrying in 30s..."
            sleep 30
          done

          echo ""
          echo "❌ Health check failed after ~10 minutes"
          echo "Last response: $BODY"
          echo ""
          echo "This is likely a Render cold start issue. Actions:"
          echo "  1. Check Render dashboard: https://dashboard.render.com"
          echo "  2. Check deploy logs for build errors"
          echo "  3. If build succeeded, Render may just need more time to start"
          exit 1

      - name: Warn on health check failure
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "🚨 Post-deploy health check failed"
          echo "The push to main triggered a Render auto-deploy, but /health did not return 200."
          echo "This is common with Render free tier (cold start + Prisma migrate)."
          echo "Check: https://dashboard.render.com → gablura-backend → Logs"

      # ─────────────────────────────────────────────
      # ARTIFACTS
      # ─────────────────────────────────────────────
      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage/
            test-results/

      - name: Debug Prisma
        run: |
          node -e "const { PrismaClient } = require('@prisma/client'); const p = new PrismaClient(); console.log('count:', typeof p.meeting.count)"
