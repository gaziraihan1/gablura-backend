version: '3.9'

services:
  db:
    image: postgres:16
    container_name: _test_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: _test
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: _test_redis
    restart: always
    ports:
      - "6379:6379"


volumes:
  pgdata: